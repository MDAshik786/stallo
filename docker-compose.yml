services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stallo
      POSTGRES_PASSWORD: stallo
      POSTGRES_DB: stallo
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stallo -d stallo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata: